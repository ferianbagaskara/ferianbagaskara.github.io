<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-labelledby="pipe-d-title pipe-d-desc"><title id="pipe-d-title">Illustrative observability workflow</title><desc id="pipe-d-desc">Ping data and raw SolarWinds data from SQL Server are processed in Python, stored in a database, and supplied to Grafana dashboards and alerts.</desc><defs><marker id="pipe-d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1 9 5 0 9z" fill="#1d5fe0"/></marker></defs><g fill="none" stroke="#1d5fe0" stroke-width="2" marker-end="url(#pipe-d-arrow)"><path d="M124 55 H143 V100 H158"/><path d="M124 145 H143 V100 H158"/><path d="M269 100 H302"/><path d="M390 100 H423"/></g><g fill="#fff" stroke="#b9c0cb" stroke-width="1.2"><rect x="8" y="25" width="116" height="60" rx="6"/><rect x="8" y="115" width="116" height="60" rx="6"/><rect x="158" y="65" width="111" height="70" rx="6"/><rect x="302" y="65" width="88" height="70" rx="6"/><rect x="423" y="65" width="129" height="70" rx="6"/></g><g font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="650" fill="#14171c" text-anchor="middle"><text x="66" y="53">Ping data</text><text x="66" y="143">SolarWinds</text><text x="213" y="95">Python</text><text x="346" y="104">Database</text><text x="487" y="95">Grafana</text></g><g font-family="'JetBrains Mono',monospace" font-size="11" fill="#566070" text-anchor="middle"><text x="66" y="162">SQL Server</text><text x="213" y="116">processing</text><text x="487" y="116">views + alerts</text></g></svg>
