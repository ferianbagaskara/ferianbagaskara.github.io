<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-labelledby="pipe-d-title pipe-d-desc">
  <title id="pipe-d-title">Illustrative observability workflow</title>
  <desc id="pipe-d-desc">Ping data and raw SolarWinds data from SQL Server are processed in Python, stored in a database, and supplied to Grafana dashboards and alerts.</desc>
  <defs><marker id="pipe-d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1 9 5 0 9z" fill="#1d5fe0"/></marker></defs>
  <g fill="none" stroke="#1d5fe0" stroke-width="2" marker-end="url(#pipe-d-arrow)"><path d="M122 53 H139 V120 H154"/><path d="M122 187 H139 V120 H154"/><path d="M270 120 H286 V53 H302"/><path d="M367 88 V150"/></g>
  <g fill="#fff" stroke="#b9c0cb" stroke-width="1.2"><rect x="8" y="18" width="114" height="70" rx="6"/><rect x="8" y="152" width="114" height="70" rx="6"/><rect x="154" y="82" width="116" height="76" rx="6"/><rect x="302" y="18" width="130" height="70" rx="6"/><rect x="302" y="150" width="130" height="76" rx="6"/></g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="650" fill="#14171c"><text x="65" y="59">Ping data</text><text x="65" y="182">SolarWinds</text><text x="212" y="114">Python</text><text x="367" y="59">Database</text><text x="367" y="174">Grafana</text></g>
    <g font-size="15" fill="#566070"><text x="65" y="205">SQL Server</text><text x="212" y="139">processing</text><text x="367" y="196">views</text><text x="367" y="216">+ alerts</text></g>
