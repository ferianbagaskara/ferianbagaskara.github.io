<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-labelledby="topo-d-title topo-d-desc">
  <title id="topo-d-title">Illustrative hybrid topology</title>
  <desc id="topo-d-desc">Generic diagram, not actual architecture: an on-prem data center connected to AWS via Direct Connect and to Google Cloud via Interconnect.</desc>
  <defs>
    <marker id="topo-d-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#1d5fe0"/></marker>
  </defs>
  <g fill="none" stroke="#1d5fe0" stroke-width="2">
    <path d="M190 100 C 260 100, 270 46, 352 46" marker-start="url(#topo-d-arrow)" marker-end="url(#topo-d-arrow)"/>
    <path d="M190 100 C 260 100, 270 154, 352 154" marker-start="url(#topo-d-arrow)" marker-end="url(#topo-d-arrow)"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="11" fill="#1d5fe0" text-anchor="middle">
    <rect x="222" y="47" width="104" height="22" rx="4" fill="#fff" stroke="#d3d8e0"/>
    <text x="274" y="62">Direct Connect</text>
    <rect x="228" y="131" width="92" height="22" rx="4" fill="#fff" stroke="#d3d8e0"/>
    <text x="274" y="146">Interconnect</text>
  </g>
  <!-- On-prem data center -->
  <rect x="20" y="58" width="170" height="84" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <g transform="translate(38 80)" fill="none" stroke="#2f3642" stroke-width="1.6"><rect width="30" height="10" rx="2"/><rect y="14" width="30" height="10" rx="2"/><rect y="28" width="30" height="10" rx="2"/></g>
  <g fill="#16a34a"><circle cx="63" cy="85" r="1.8"/><circle cx="63" cy="99" r="1.8"/><circle cx="63" cy="113" r="1.8"/></g>
  <text x="82" y="96" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#14171c">On-prem DC</text>
  <text x="82" y="114" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#566070">data center</text>
  <!-- AWS -->
  <rect x="352" y="12" width="188" height="68" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <rect x="366" y="28" width="36" height="36" rx="8" fill="#eef3fd"/>
  <text x="384" y="50" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1d5fe0">AWS</text>
  <text x="414" y="43" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#14171c">AWS</text>
  <text x="414" y="61" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#566070">VPC · DNS · LB</text>
  <!-- GCP -->
  <rect x="352" y="120" width="188" height="68" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <rect x="366" y="136" width="36" height="36" rx="8" fill="#eef3fd"/>
  <text x="384" y="158" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1d5fe0">GCP</text>
  <text x="414" y="151" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#14171c">Google Cloud</text>
  <text x="414" y="169" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#566070">VPC · DNS · LB</text>
</svg>
