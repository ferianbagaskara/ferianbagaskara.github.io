<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-labelledby="topo-d-title topo-d-desc">
  <title id="topo-d-title">Illustrative hybrid topology</title>
  <desc id="topo-d-desc">Generic diagram, not actual architecture: an on-prem data center connected to AWS via Direct Connect and to Google Cloud via Interconnect.</desc>
  <defs><marker id="topo-d-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#1d5fe0"/></marker></defs>
  <g fill="none" stroke="#1d5fe0" stroke-width="2">
    <path d="M144 120 C190 120 190 53 266 53" marker-start="url(#topo-d-arrow)" marker-end="url(#topo-d-arrow)"/>
    <path d="M144 120 C190 120 190 187 266 187" marker-start="url(#topo-d-arrow)" marker-end="url(#topo-d-arrow)"/>
  </g>
  <g fill="#fff" stroke="#b9c0cb" stroke-width="1.2"><rect x="8" y="78" width="136" height="84" rx="8"/><rect x="266" y="10" width="166" height="86" rx="8"/><rect x="266" y="144" width="166" height="86" rx="8"/></g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="700" fill="#14171c"><text x="76" y="112">On-prem DC</text><text x="349" y="43">AWS</text><text x="349" y="177">Google Cloud</text></g>
    <g font-size="15" fill="#566070"><text x="76" y="136">data center</text><text x="349" y="70">VPC · DNS · LB</text><text x="349" y="204">VPC · DNS · LB</text></g>
    <g font-size="15" font-weight="600" fill="#1d5fe0"><rect x="157" y="38" width="96" height="44" rx="4" fill="#fff" stroke="#d3d8e0"/><text x="205" y="56">Direct</text><text x="205" y="75">Connect</text><rect x="151" y="165" width="108" height="28" rx="4" fill="#fff" stroke="#d3d8e0"/><text x="205" y="184">Interconnect</text></g>
  </g>
</svg>
