<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 284" width="228" height="284" role="img" aria-labelledby="topo-m-title topo-m-desc">
  <title id="topo-m-title">Illustrative hybrid topology</title>
  <desc id="topo-m-desc">Generic diagram, not actual architecture: an on-prem data center connected to AWS via Direct Connect and to Google Cloud via Interconnect.</desc>
  <defs><marker id="topo-m-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#1d5fe0"/></marker></defs>
  <g fill="none" stroke="#1d5fe0" stroke-width="2"><path d="M94 76 C94 110 56 110 56 172" marker-start="url(#topo-m-arrow)" marker-end="url(#topo-m-arrow)"/><path d="M134 76 C134 110 172 110 172 172" marker-start="url(#topo-m-arrow)" marker-end="url(#topo-m-arrow)"/></g>
  <g font-family="'JetBrains Mono',monospace" font-weight="600" font-size="13" fill="#1d5fe0" text-anchor="middle">
    <rect x="5" y="106" width="102" height="44" rx="4" fill="#fff" stroke="#d3d8e0"/><text x="56" y="124">Direct</text><text x="56" y="142">Connect</text>
    <rect x="121" y="116" width="102" height="26" rx="4" fill="#fff" stroke="#d3d8e0"/><text x="172" y="134">Interconnect</text>
  </g>
  <rect x="28" y="8" width="172" height="68" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <g transform="translate(40 23)" fill="none" stroke="#2f3642" stroke-width="1.6"><rect width="28" height="9" rx="2"/><rect y="13" width="28" height="9" rx="2"/><rect y="26" width="28" height="9" rx="2"/></g>
  <text x="78" y="39" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#14171c">On-prem DC</text>
  <text x="78" y="58" font-family="'JetBrains Mono',monospace" font-size="13" fill="#566070">data center</text>
  <g fill="#fff" stroke="#b9c0cb" stroke-width="1.2"><rect x="4" y="172" width="104" height="104" rx="10"/><rect x="120" y="172" width="104" height="104" rx="10"/></g>
  <g text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#14171c"><text x="56" y="205">AWS</text><text x="172" y="197">Google</text><text x="172" y="216">Cloud</text></g>
  <g text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#566070"><text x="56" y="239">VPC · DNS</text><text x="56" y="258">· LB</text><text x="172" y="239">VPC · DNS</text><text x="172" y="258">· LB</text></g>
</svg>
