<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 244" width="340" height="244" role="img" aria-labelledby="topo-m-title topo-m-desc">
  <title id="topo-m-title">Illustrative hybrid topology</title>
  <desc id="topo-m-desc">Generic diagram, not actual architecture: an on-prem data center connected to AWS via Direct Connect and to Google Cloud via Interconnect.</desc>
  <defs>
    <marker id="topo-m-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#1d5fe0"/></marker>
  </defs>
  <g fill="none" stroke="#1d5fe0" stroke-width="2">
    <path d="M150 76 C 150 110, 85 110, 85 160" marker-start="url(#topo-m-arrow)" marker-end="url(#topo-m-arrow)"/>
    <path d="M190 76 C 190 110, 255 110, 255 160" marker-start="url(#topo-m-arrow)" marker-end="url(#topo-m-arrow)"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="11.5" fill="#1d5fe0" text-anchor="middle">
    <rect x="14" y="100" width="112" height="24" rx="4" fill="#fff" stroke="#d3d8e0"/>
    <text x="70" y="116">Direct Connect</text>
    <rect x="220" y="100" width="104" height="24" rx="4" fill="#fff" stroke="#d3d8e0"/>
    <text x="272" y="116">Interconnect</text>
  </g>
  <rect x="90" y="8" width="160" height="68" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <g transform="translate(106 23)" fill="none" stroke="#2f3642" stroke-width="1.6"><rect width="28" height="9" rx="2"/><rect y="13" width="28" height="9" rx="2"/><rect y="26" width="28" height="9" rx="2"/></g>
  <text x="146" y="39" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171c">On-prem DC</text>
  <text x="146" y="57" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#566070">data center</text>
  <rect x="10" y="160" width="150" height="72" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <text x="85" y="190" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171c">AWS</text>
  <text x="85" y="210" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#566070">VPC · DNS · LB</text>
  <rect x="180" y="160" width="150" height="72" rx="10" fill="#fff" stroke="#b9c0cb" stroke-width="1.2"/>
  <text x="255" y="190" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171c">Google Cloud</text>
  <text x="255" y="210" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#566070">VPC · DNS · LB</text>
</svg>
