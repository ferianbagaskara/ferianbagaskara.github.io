experience:
  - role: Network & Cloud Network Engineer
    employer: A top-tier Indonesian bank
    period: 2022–present
    # Each track may have up to 5 confirmed responsibilities (240 characters each).
    # Leave responsibilities absent or [] until personal responsibilities are confirmed.
    tracks:
      - title: On-prem network engineering
        period: 2022–present
        responsibilities: []
      - title: AWS and Google Cloud network architecture and engineering
        period: 2025-present
        responsibilities: []

projects:
  - title: Hybrid multi-cloud banking network
    nda: true            # project details covered by NDA
    problem: >-
      Mobile and corporate banking workloads required active-active operation across
      on-prem data centers, AWS, and Google Cloud.
    role: >-
      Designed and implemented the AWS network; implemented the Google Cloud network.
    outcome: >-
      Supported flexible cloud workload scaling and development environment provisioning.
    tags: [AWS, GCP, Direct Connect, Interconnect, VPC, DNS, Load balancers, Hybrid cloud]
    detailSummary: Network scope and illustrative topology
    detailText: >-
      Work covered Direct Connect and Interconnect, VPCs, DNS, load balancers, and
      traffic flows within and between VPCs and at ingress/egress.
    diagram: true        # generic topology, labelled "illustrative, not actual architecture"
  - title: Network observability pipeline
    nda: false
    privateCode: true    # private source code; workflow described
    problem: >-
      The on-prem network needed consistent health visibility from ping
      and raw SolarWinds data.
    role: >-
      Built a Python pipeline to process ping and raw SolarWinds data from SQL Server,
      store results in a database, and feed Grafana dashboards with alerting.
    outcome: >-
      Provided dashboards and alerts for the on-prem network.
    tags: [Python, SolarWinds, SQL Server, Grafana, Alerting]
    detailSummary: Data pipeline details
    detailText: ping + SolarWinds (SQL Server) → Python processing → database → Grafana dashboards and alerts

# Skills are drawn only from the confirmed projects and certs above.
skills:
  - group: Cloud networking
    items: [AWS, GCP, Direct Connect, Interconnect, VPC, DNS, Load balancers]
  - group: Network engineering
    items: [On-prem data center networking, Cisco (CCNA), Ingress/egress traffic flows]
  - group: Automation & observability
    items: [Python, SQL Server, SolarWinds, Grafana, Alerting]
