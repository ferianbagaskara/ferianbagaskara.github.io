settings:
  # Keep true while placeholders remain, so search engines skip the draft.
  noindex: true
  siteUrl: https://ferianbagaskara.github.io
  lang: en
  # Leave false during colleague review. At launch, true hides any link that is still "" instead of showing "coming soon".
  hidePlaceholders: false
  ogImageConfirmed: false   # Stale draft bitmap: replace/review against current YAML before enabling.

profile:
  name: Ferian Bagaskara
  headline: Cloud Network Engineer | Hybrid & Multi-Cloud Networking
  tagline: >-
    I work on networks that connect on-prem data centers, AWS, and Google Cloud.
    My work includes hybrid cloud networking and an on-prem network observability
    pipeline built with Python and Grafana.
  availability: Open to remote and international roles
  location: Based in Indonesia
  headshot: ""   # No portrait in design C; generated placeholder is archived outside public/.
  cvUrl: ""   # PLACEHOLDER: add Ferian's final CV only after its contents are confirmed.

contact:
  # Unconfirmed parts never create actions; confirmed parts have a human-readable noscript fallback.
  emailConfirmed: false
  emailUser: placeholder
  emailDomain: invalid.invalid
  linkedinUrl: ""        # PLACEHOLDER: e.g. https://www.linkedin.com/in/your-name
  # Optional line above the contact buttons; leave "" to show just "Contact".
